<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PRO TIME</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="phone">
        <div id="app"><p style="padding:24px;color:#17465b">Cargando ProTime… Si este mensaje permanece, verifica que las carpetas js y css estén junto a index.html.</p></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/incidencias.js"></script>
    <script src="js/app.js"></script>
    <script src="js/web.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/mapa.js"></script>
    <script>
        try { render(); }
        catch (error) {
            console.error('ProTime: error al iniciar', error);
            document.getElementById('app').innerHTML = '<div style="padding:24px;color:#17465b;background:white"><h2>No se pudo iniciar ProTime</h2><p>Verifica que hayas extraído todo el ZIP y que las carpetas js y css estén junto a index.html.</p><pre id="startupError" style="white-space:pre-wrap;color:#a33"></pre></div>';
            document.getElementById('startupError').textContent = error.message;
        }
    </script>
</body>
</html>
